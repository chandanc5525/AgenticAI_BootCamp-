[project]
name = "agentic-ai-pytorch-bootcamp"
version = "0.1.0"
description = "A practical 16-week course from PyTorch foundations to production Agentic AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "torch",
    "torchvision",
    "jupyter",
    "ipykernel",
    "transformers",
    "datasets",
    "tokenizers",
    "accelerate",
    "sentence-transformers",
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langgraph",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "httpx",
    "pypdf",
    "faiss-cpu",
    "chromadb",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
